font_family JetBrainsMono Nerd Font
font_size 10
include ${KITTY_OS}.conf

adjust_line_height 110%
adjust_column_width 0
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono

macos_option_as_alt yes
copy_on_select clipboard
strip_trailing_spaces smart
enable_audio_bell no
confirm_os_window_close 0

background_opacity 0.8
dynamic_background_opacity yes
window_padding_width 8
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal

# Rosé Pine (main): https://github.com/rose-pine/kitty
foreground #e0def4
background #191724
selection_foreground #e0def4
selection_background #403d52
cursor #524f67
cursor_text_color #e0def4
cursor_blink_interval 0
url_color #c4a7e7

active_tab_foreground #e0def4
active_tab_background #26233a
inactive_tab_foreground #6e6a86
inactive_tab_background #191724
tab_bar_background #191724

active_border_color #31748f
inactive_border_color #403d52
bell_border_color #f6c177

color0 #26233a
color1 #eb6f92
color2 #31748f
color3 #f6c177
color4 #9ccfd8
color5 #c4a7e7
color6 #ebbcba
color7 #e0def4
color8 #6e6a86
color9 #eb6f92
color10 #31748f
color11 #f6c177
color12 #9ccfd8
color13 #c4a7e7
color14 #ebbcba
color15 #e0def4
